
query getCurrentUserProjects {
  viewer {
    login
    projectsV2(first: 100) {
      nodes {
        ...ProjectDetails
      }
    }
  }
}

query getProject($projectId: ID!) {
  node(id: $projectId) {
    ...ProjectDetails
  }
}

fragment ProjectDetails on ProjectV2 {
  title
  id
  databaseId
  number
  owner {
    ... on User {
      login
    }
    ... on Organization {
      login
    }
  }
}


query getProjectLabels($projectId: ID!)  {
  node(id: $projectId) {
    ...ProjectLabels
  }
}

fragment ProjectLabels on ProjectV2 {
  repositories(first: 100) {
    nodes {
      id
      labels(first: 100) {
        nodes {
          color
          description
          id
          name
        }
      }
    }
  }
}

query getRepositoryProjects { 
  viewer { 
	login
    repositories(first: 100) {
      nodes {
        name
        projects(first:10) {
          nodes {
            id
            databaseId
            name
          }
        }
      }
    }
  }
}

query getRepositoryProjectsByOwner($owner: String!) { 
  repositoryOwner(login: $owner) { 
    repositories(first: 10) {
      nodes {
        name
        projects(first:10) {
          nodes {
            id
            databaseId
            name
          }
        }
      }
    }
  }
}
